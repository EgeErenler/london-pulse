name: Ingest

# Collect one snapshot from every source, twice an hour.
# Minutes 7 and 37 avoid the busy top of the hour on GitHub's scheduler.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Ingest and compaction both write to the `data` branch, so they never run at the same time.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Collect a snapshot
        env:
          LP_DATA_DIR: data
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: london-pulse ingest

      - name: Save the snapshot to the data branch
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q
