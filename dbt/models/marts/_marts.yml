version: 2

models:
  - name: dim_lines
    description: One row per Tube, Overground, DLR or Elizabeth line.
    columns:
      - name: line_id
        tests: [unique, not_null]

  - name: fct_line_status_daily
    description: Daily reliability per line, as the share of snapshots with a normal service.
    columns:
      - name: service_date
        tests: [not_null]
      - name: line_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lines')
                field: line_id
      - name: good_service_share
        description: 1.0 means no disruption was seen that day.

  - name: fct_disruptions_by_hour
    description: Share of snapshots disrupted, by line and hour of day (London time).

  - name: fct_bike_network_snapshots
    description: The whole Santander Cycles network at each snapshot.
    columns:
      - name: captured_at_utc
        tests: [unique, not_null]

  - name: fct_station_latest
    description: Latest reading for every docking station.
    columns:
      - name: station_id
        tests: [unique, not_null]

  - name: mart_city_pulse_hourly
    description: Transport, bikes, weather and air quality per hour, side by side.
    columns:
      - name: hour_local
        tests: [unique, not_null]
